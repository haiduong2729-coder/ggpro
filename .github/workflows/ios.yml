name: Google Pro

# =====================================================================
# CẤU HÌNH NHANH
# =====================================================================
env:
  EXT_SRC_DIR: "extension_src"
  APP_NAME: "GooglePro"
  BUNDLE_ID: "com.qhuy.googlepro"
  IPA_NAME: "gg-pro"
  ARTIFACT_NAME: "ggpro-extension"
  RELEASE_TAG: "latest-ipa"

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (auto = tự phát hiện từ extension_src)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - with-extension
          - app-only
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. TỰ ĐỘNG CHỌN MODE
      - name: Detect build mode
        id: detect
        run: |
          MODE="${{ github.event.inputs.build_mode || 'auto' }}"
          if [ "$MODE" = "auto" ]; then
            if [ -f "${EXT_SRC_DIR}/manifest.json" ]; then
              MODE="with-extension"
            else
              MODE="app-only"
            fi
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "==> Build mode: $MODE"

      - name: Verify extension source (with-extension mode)
        if: steps.detect.outputs.mode == 'with-extension'
        run: |
          if [ ! -f "${EXT_SRC_DIR}/manifest.json" ]; then
            echo "ERROR: manifest.json không tồn tại trong ${EXT_SRC_DIR}"
            exit 1
          fi
          echo "✓ Đã xác nhận extension source"

      # 2. CHUYỂN ĐỔI CHROME EXT -> SAFARI WEB EXT
      - name: Convert Chrome Extension to Safari Web Extension
        if: steps.detect.outputs.mode == 'with-extension'
        run: |
          rm -rf output
          mkdir -p output
          xcrun safari-web-extension-converter "${EXT_SRC_DIR}" \
            --ios-only \
            --project-location output \
            --app-name "${APP_NAME}" \
            --bundle-identifier "${BUNDLE_ID}" \
            --swift \
            --no-open \
            --no-prompt

      # 3. SYNC VERSION (fix ValidateEmbeddedBinary mismatch)
      - name: Sync version & bundle ID between app and extension
        if: steps.detect.outputs.mode == 'with-extension'
        run: |
          set -e
          APP_INFO=$(find output -path "*/${APP_NAME}/Info.plist" -not -path "*Extension*" 2>/dev/null | head -n 1)
          EXT_INFO=$(find output -path "*Extension/Info.plist" 2>/dev/null | head -n 1)

          if [ -z "$APP_INFO" ] || [ -z "$EXT_INFO" ]; then
            echo "WARN: không tìm thấy đủ 2 Info.plist, bỏ qua sync"
            exit 0
          fi

          APP_SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_INFO" 2>/dev/null || echo "1.0")
          APP_BUNDLE_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_INFO" 2>/dev/null || echo "1")
          EXT_SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$EXT_INFO" 2>/dev/null || echo "1.0")
          EXT_BUNDLE_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$EXT_INFO" 2>/dev/null || echo "1")

          echo "App: $APP_SHORT_VER / $APP_BUNDLE_VER"
          echo "Ext: $EXT_SHORT_VER / $EXT_BUNDLE_VER"

          if [ "$EXT_SHORT_VER" != "$APP_SHORT_VER" ] || [ "$EXT_BUNDLE_VER" != "$APP_BUNDLE_VER" ]; then
            echo "==> Đồng bộ version extension theo app..."
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_SHORT_VER" "$EXT_INFO" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_SHORT_VER" "$EXT_INFO"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUNDLE_VER" "$EXT_INFO" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $APP_BUNDLE_VER" "$EXT_INFO"
            echo "✓ Đã sync"
          else
            echo "✓ Version đã khớp, không cần sync"
          fi

      # 4. BUILD + ĐÓNG GÓI (tolerant với ValidateEmbeddedBinary)
      - name: Build and package IPA
        run: |
          set -e
          PROJECT_PATH=$(find output -name "*.xcodeproj" -maxdepth 3 -type d | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: không tìm thấy .xcodeproj trong output/"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          echo "Project: $PROJECT_NAME ($PROJECT_DIR)"
          cd "$PROJECT_DIR"

          SCHEME_LIST=$(xcodebuild -list -project "$PROJECT_NAME.xcodeproj" 2>&1 || true)
          echo "=== Schemes ==="; echo "$SCHEME_LIST"; echo "==============="

          SCHEME=$(echo "$SCHEME_LIST" | grep -E '^\s+.*\(iOS\)' | head -n 1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$SCHEME_LIST" | awk '/Schemes:/{flag=1; next} flag && NF{print; exit}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi
          if [ -z "$SCHEME" ]; then echo "ERROR: no scheme"; exit 1; fi
          echo "==> Using scheme: $SCHEME"

          # BUILD tolerant — unsigned + skip product validation
          set +e
          xcodebuild build \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO \
            ENABLE_BITCODE=NO 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          # Tìm .app bất kể build exit
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -n 1)
          [ -z "$APP_PATH" ] && APP_PATH=$(find ./DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "=== Build log (tail) ==="; tail -80 /tmp/build.log
            echo "ERROR: không có .app được sinh ra"
            exit 1
          fi
          echo "==> .app: $APP_PATH"

          if [ $BUILD_EXIT -ne 0 ]; then
            if grep -q "ValidateEmbeddedBinary" /tmp/build.log; then
              echo "⚠ xcodebuild exit=$BUILD_EXIT do ValidateEmbeddedBinary trên extension unsigned"
              echo "⚠ Đây là hành vi bình thường với build unsigned — .app đã đủ để đóng gói"
            else
              echo "⚠ xcodebuild exit=$BUILD_EXIT (không phải ValidateEmbeddedBinary) — vẫn thử đóng gói"
            fi
          fi

          # Mode app-only: gỡ extension khỏi .app
          if [ "${{ steps.detect.outputs.mode }}" = "app-only" ]; then
            if [ -d "$APP_PATH/PlugIns" ]; then
              echo "==> App-only: gỡ PlugIns khỏi .app"
              rm -rf "$APP_PATH/PlugIns"
            fi
          fi

          # Verify extension (with-extension mode)
          if [ "${{ steps.detect.outputs.mode }}" = "with-extension" ]; then
            if [ -d "$APP_PATH/PlugIns" ] && find "$APP_PATH/PlugIns" -name "*.appex" | grep -q .; then
              echo "✓ Extension đã nhúng đúng"
            else
              echo "⚠ CẢNH BÁO: không tìm thấy .appex trong .app"
            fi
          fi

          # Đóng gói IPA
          rm -rf Payload; mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -f "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa"
          zip -r -q "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa" Payload

          echo "=== IPA ==="
          ls -lh "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa"
          unzip -l "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa" | head -25

      - name: Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "IPA Build: ${{ env.APP_NAME }}"
          body: |
            Tải file **${{ env.IPA_NAME }}.ipa** ở mục Assets bên dưới.
            Build mode: **${{ steps.detect.outputs.mode }}**
          files: ${{ env.IPA_NAME }}.ipa
          prerelease: false
          make_latest: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.IPA_NAME }}.ipa
          compression-level: 0
