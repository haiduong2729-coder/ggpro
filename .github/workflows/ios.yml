name: Google Pro

# =====================================================================
# CẤU HÌNH NHANH
# =====================================================================
env:
  EXT_SRC_DIR: "extension_src"
  APP_NAME: "GooglePro"
  BUNDLE_ID: "com.qhuy.googlepro"
  IPA_NAME: "gg-pro"
  ARTIFACT_NAME: "ggpro-extension"
  RELEASE_TAG: "latest-ipa"

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. TỰ ĐỘNG PHÁT HIỆN EXTENSION
      - name: Detect extension source
        id: detect
        run: |
          if [ -f "${EXT_SRC_DIR}/manifest.json" ]; then
            echo "has_extension=true" >> $GITHUB_OUTPUT
            echo "✓ Phát hiện extension trong ${EXT_SRC_DIR}"
          else
            echo "has_extension=false" >> $GITHUB_OUTPUT
            echo "ERROR: Không có ${EXT_SRC_DIR}/manifest.json — workflow này yêu cầu extension"
            exit 1
          fi

      # 2. CHUYỂN ĐỔI CHROME EXT → XCODE PROJECT
      - name: Convert Chrome Extension to Safari Web Extension
        run: |
          rm -rf output && mkdir -p output
          xcrun safari-web-extension-converter "${EXT_SRC_DIR}" \
            --ios-only \
            --project-location output \
            --app-name "${APP_NAME}" \
            --bundle-identifier "${BUNDLE_ID}" \
            --swift \
            --no-open \
            --no-prompt

      # 3. SYNC METADATA (version + bundle ID) — chống ValidateEmbeddedBinary
      - name: Sync app & extension metadata
        run: |
          set -e
          APP_PLIST=$(find output -path "*/${APP_NAME}/Info.plist" 2>/dev/null | head -n 1)
          EXT_PLIST=$(find output -path "*Extension*/Info.plist" 2>/dev/null | head -n 1)

          if [ -z "$APP_PLIST" ] || [ -z "$EXT_PLIST" ]; then
            echo "ERROR: Không tìm thấy Info.plist của app hoặc extension"
            echo "APP_PLIST=$APP_PLIST"
            echo "EXT_PLIST=$EXT_PLIST"
            exit 1
          fi

          echo "App plist: $APP_PLIST"
          echo "Ext plist: $EXT_PLIST"

          # Force set cứng version cho CẢ HAI (tránh mismatch tuyệt đối)
          for plist in "$APP_PLIST" "$EXT_PLIST"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$plist"
          done

          # Fix extension bundle ID nếu thiếu prefix app
          EXT_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$EXT_PLIST" 2>/dev/null || echo "")
          echo "Extension bundle ID hiện tại: $EXT_ID"
          if [[ ! "$EXT_ID" =~ ^${BUNDLE_ID}\. ]]; then
            NEW_ID="${BUNDLE_ID}.Extension"
            echo "==> Fix bundle ID: $EXT_ID → $NEW_ID"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_ID" "$EXT_PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $NEW_ID" "$EXT_PLIST"
          else
            echo "✓ Bundle ID đã đúng prefix"
          fi

          echo "✓ Metadata synced: v1.0 (1)"

      # 4. BUILD (tolerant với ValidateEmbeddedBinary)
      - name: Build iOS app
        run: |
          set -e
          PROJECT_PATH=$(find output -name "*.xcodeproj" -maxdepth 3 -type d | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: không tìm thấy .xcodeproj"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          echo "Project: $PROJECT_NAME"
          cd "$PROJECT_DIR"

          SCHEME_LIST=$(xcodebuild -list -project "$PROJECT_NAME.xcodeproj" 2>&1)
          echo "=== Schemes ==="; echo "$SCHEME_LIST"; echo "==============="

          SCHEME=$(echo "$SCHEME_LIST" | grep -E '^\s+.*\(iOS\)' | head -n 1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$SCHEME_LIST" | awk '/Schemes:/{flag=1; next} flag && NF{print; exit}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi
          if [ -z "$SCHEME" ]; then echo "ERROR: không có scheme"; exit 1; fi
          echo "==> Scheme: $SCHEME"

          set +e
          xcodebuild build \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO \
            ENABLE_BITCODE=NO 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          echo "Build exit code: $BUILD_EXIT"

          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -n 1)
          [ -z "$APP_PATH" ] && APP_PATH=$(find ./DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "=== Build FAILED — không có .app ==="
            grep -i "error:" /tmp/build.log | head -30
            exit 1
          fi

          echo "✓ .app: $APP_PATH"

          if [ $BUILD_EXIT -ne 0 ]; then
            if grep -q "ValidateEmbeddedBinary" /tmp/build.log; then
              echo "⚠ ValidateEmbeddedBinary fail (bình thường với build unsigned) — sẽ force-embed .appex ở bước đóng gói"
            else
              echo "⚠ Build có lỗi khác nhưng .app đã tồn tại — tiếp tục đóng gói"
              grep -i "error:" /tmp/build.log | head -10
            fi
          fi

          echo "$APP_PATH" > /tmp/app_path.txt

      # 5. VERIFY + FORCE-EMBED .APPEX + ĐÓNG GÓI IPA
      - name: Verify, force-embed and package IPA
        run: |
          set -e
          APP_PATH=$(cat /tmp/app_path.txt)
          echo "==> Đóng gói: $APP_PATH"

          # Nếu ValidateEmbeddedBinary fail khiến .appex không vào PlugIns → force embed
          if ! find "$APP_PATH/PlugIns" -name "*.appex" 2>/dev/null | grep -q .; then
            echo "⚠ .appex chưa có trong .app — force embed từ DerivedData"
            APPEX=$(find output -name "*.appex" -type d 2>/dev/null | head -n 1)
            if [ -n "$APPEX" ]; then
              echo "Tìm thấy .appex: $APPEX"
              mkdir -p "$APP_PATH/PlugIns"
              cp -R "$APPEX" "$APP_PATH/PlugIns/"
              echo "✓ Đã force-embed"
            else
              echo "FATAL: không tìm thấy .appex ở bất kỳ đâu"
              exit 1
            fi
          fi

          # Verify lần cuối
          APPEX_FINAL=$(find "$APP_PATH/PlugIns" -name "*.appex" 2>/dev/null | head -n 1)
          if [ -z "$APPEX_FINAL" ]; then
            echo "FATAL: .appex vẫn không có trong .app"
            exit 1
          fi
          echo "✓ .appex: $APPEX_FINAL"

          # Đồng bộ version lần cuối trong .appex đã đóng gói (chống mismatch)
          APP_PLIST="$APP_PATH/Info.plist"
          APPEX_PLIST="$APPEX_FINAL/Info.plist"
          if [ -f "$APP_PLIST" ] && [ -f "$APPEX_PLIST" ]; then
            APP_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST" 2>/dev/null || echo "1")
            APP_SVER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST" 2>/dev/null || echo "1.0")
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_VER" "$APPEX_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_SVER" "$APPEX_PLIST" 2>/dev/null || true
            echo "✓ Version: app v${APP_SVER} (${APP_VER}) — extension đồng bộ"
          fi

          # Đóng gói
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -f "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa"
          zip -r -q "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa" Payload

          echo "=== IPA created ==="
          ls -lh "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa"

          # Verify CUỐI CÙNG: .appex có trong IPA
          if unzip -l "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa" | grep -q "\.appex/"; then
            echo "✅ XÁC NHẬN: .appex có trong IPA"
            echo "--- .appex entries ---"
            unzip -l "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa" | grep "\.appex/" | head -5
          else
            echo "❌ FATAL: .appex KHÔNG có trong IPA"
            unzip -l "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa" | head -20
            exit 1
          fi

      # 6. PHÁT HÀNH
      - name: Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "IPA Build: ${{ env.APP_NAME }}"
          body: |
            Tải **${{ env.IPA_NAME }}.ipa** ở Assets bên dưới.
            ✓ Đã bao gồm Safari Web Extension (`.appex` bên trong `PlugIns/`).
          files: ${{ env.IPA_NAME }}.ipa
          prerelease: false
          make_latest: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.IPA_NAME }}.ipa
          compression-level: 0
